---
apiVersion: v1
kind: Ingress
metadata:
  name: apigateway-ingress
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apigateway
            port:
              number: 80

  ---
