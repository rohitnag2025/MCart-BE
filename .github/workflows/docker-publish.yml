name: Build and Push Docker Images to ACR

on:
  push:
    branches: [ cloud-deployment-user ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: mynagpacr.azurecr.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build and push only UserService
      - name: Build and push UserService
        run: |
          docker build -t $REGISTRY/userservice:latest ./src/UserService
          docker push $REGISTRY/userservice:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Create .kube directory
        run: mkdir -p $HOME/.kube

      - name: Set up Kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      - name: Create userservice-secrets in AKS
        run: |
          kubectl create secret generic userservice-secrets \
            --from-literal=SQLSERVER_CONNECTION_STRING="${{ secrets.SQLSERVER_CONNECTION_STRING }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY }}" \
            --from-literal=FACEBOOK_APP_ID="${{ secrets.FACEBOOK_APP_ID }}" \
            --from-literal=FACEBOOK_APP_SECRET="${{ secrets.FACEBOOK_APP_SECRET }}" \
            --from-literal=TWITTER_API_KEY="${{ secrets.TWITTER_API_KEY }}" \
            --from-literal=TWITTER_API_SECRET="${{ secrets.TWITTER_API_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy UserService to AKS
        run: |
          kubectl apply -f k8s-userservice.yaml
