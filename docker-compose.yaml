version: '3.8'
services:
  
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mcart-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U sa -P Your_password123 -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  userservice:
    build:
      context: ./src/UserService
    environment:
      - ConnectionStrings__DefaultConnection=${SQLSERVER_CONNECTION_STRING}
      - ServiceBus__ConnectionString=${SERVICEBUS_CONNECTION_STRING}
      - ServiceBus__QueueName=${SERVICEBUS_QUEUE_NAME}
      - Jwt__Secret=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=Production
      - Authentication__Twitter__ConsumerAPIKey=${TWITTER_API_KEY}
      - Authentication__Twitter__ConsumerSecret=${TWITTER_API_SECRET}
    depends_on:
      - db
    ports:
      - "5001:8080"

  productservice:
    build:
      context: ./src/ProductService
    environment:
      - ConnectionStrings__DefaultConnection=${SQLSERVER_CONNECTION_STRING}
      - Jwt__Secret=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=Production
      - ServiceBus__ConnectionString=${SERVICEBUS_CONNECTION_STRING}
      - ServiceBus__QueueName=${SERVICEBUS_QUEUE_NAME}
    depends_on:
      - db
    ports:
      - "5002:8080"

  orderservice:
    build:
      context: ./src/OrderService
    environment:
      - ConnectionStrings__DefaultConnection=${SQLSERVER_CONNECTION_STRING}
      - ServiceBus__ConnectionString=${SERVICEBUS_CONNECTION_STRING}
      - ServiceBus__QueueName=${SERVICEBUS_QUEUE_NAME}
      - Jwt__Secret=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - db
    ports:
      - "5003:8080"
  paymentservice:
    build:
      context: ./src/PaymentService
    environment:
      - ConnectionStrings__DefaultConnection=${SQLSERVER_CONNECTION_STRING}
      - Jwt__Secret=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=Production
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - db
    ports:
      - "5007:8080"
  stripecli:
    image: stripe/stripe-cli:latest
    command: listen --forward-to paymentservice:80/api/payments/webhook
    environment:
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_DEVICE_NAME=docker
    depends_on:
      - paymentservice
  adminservice:
    build:
      context: ./src/AdminService
    environment:
      - ConnectionStrings__DefaultConnection=${SQLSERVER_CONNECTION_STRING}
      - Jwt__Secret=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - db
    ports:
      - "5004:8080"

  searchservice:
    build:
      context: ./src/SearchService
    environment:
      - ConnectionStrings__DefaultConnection=${SQLSERVER_CONNECTION_STRING}
    depends_on:
      - db
    ports:
      - "5005:8080"

  notificationservice:
    build:
      context: ./src/NotificationService
    environment:
      - ConnectionStrings__DefaultConnection=${NOTIFICATION_CONNECTION_STRING}
      - ServiceBus__ConnectionString=${SERVICEBUS_CONNECTION_STRING}
      - ServiceBus__QueueName=${SERVICEBUS_QUEUE_NAME}
    depends_on:
      - db
    ports:
      - "5006:8080"

  apigateway:
    build:
      context: ./src/ApiGateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8090:8080"
    depends_on:
      - userservice
      - productservice
      - orderservice
      - adminservice
      - searchservice
      - notificationservice
